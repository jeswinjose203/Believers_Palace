services:
  db:
    image: postgres:16-alpine
    container_name: believers_palace_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-believers_palace}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-believers_palace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: believers_palace_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-believers_palace}?sslmode=disable"
      - "up"
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: believers_palace_api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: "8080"
      HTTP_MAX_IN_FLIGHT: ${HTTP_MAX_IN_FLIGHT:-128}
      CHAT_MAX_CONNECTIONS: ${CHAT_MAX_CONNECTIONS:-4096}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GENERAL_PER_MIN: ${RATE_LIMIT_GENERAL_PER_MIN:-120}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-believers_palace}
      DB_SSLMODE: disable
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MEDIA_DIR: /app/storage/media
      MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL:-}
      SOCIAL_UPLOAD_CONCURRENCY: ${SOCIAL_UPLOAD_CONCURRENCY:-8}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      FIREBASE_AUTH_PROJECT_ID: ${FIREBASE_AUTH_PROJECT_ID:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      # Persist uploaded images (MEDIA_DIR) and certificates (STORAGE_DIR)
      # across container rebuilds/restarts. Both live under /app/storage.
      - ${MEDIA_VOLUME_SOURCE:-media_data}:/app/storage
    networks:
      - app_net

volumes:
  db_data:
  media_data:

networks:
  app_net:
    driver: bridge
