services:
  db:
    image: postgres:16-alpine
    container_name: believers_palace_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-believers_palace}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-believers_palace}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: believers_palace_migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-believers_palace}?sslmode=disable"
      - "up"
    networks:
      - app_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: believers_palace_api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-believers_palace}
      DB_SSLMODE: disable
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MEDIA_DIR: /app/storage/media
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
