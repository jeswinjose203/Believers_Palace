name: Deploy release to DigitalOcean

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: production-droplet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Archive release commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The backend archive does not depend on the APK download gitlink.
          git init --bare "$RUNNER_TEMP/release.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
            GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            git -C "$RUNNER_TEMP/release.git" fetch --depth=1 --no-tags \
              --no-recurse-submodules "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/release.git" archive --format=tar.gz \
            --output="$RUNNER_TEMP/release.tar.gz" "$GITHUB_SHA"
      - name: Deploy release archive
        shell: bash
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DROPLET_HOST:?Missing DROPLET_HOST}" "${DROPLET_USER:?Missing DROPLET_USER}"
          : "${DROPLET_SSH_KEY:?Missing DROPLET_SSH_KEY}" "${DROPLET_KNOWN_HOSTS:?Missing DROPLET_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DROPLET_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
              -l "$DROPLET_USER" -- "$DROPLET_HOST" \
              "set -eu; dir=\$HOME/believers-palace/releases/$release_id; mkdir -p \"\$dir\"; tar -xzf - -C \"\$dir\"; bash \"\$dir/deploy/deploy-droplet.sh\"" \
              < "$RUNNER_TEMP/release.tar.gz"
