name: believers_palace
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  flutter_riverpod: ^2.6.1
  intl: ^0.20.3
  file_picker: ^10.3.10
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  video_player: ^2.11.1
  video_player_win: ^3.3.2
  visibility_detector: ^0.4.0+2
  table_calendar: ^3.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  web_socket_channel: ^3.0.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  firebase_auth: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/app_icon.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# App launcher icon. Generate the native icons with:
#   flutter pub get
#   dart run flutter_launcher_icons
# (run `flutter create .` first if the android/ios folders are missing).
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  remove_alpha_ios: true
  # Padded background for Android 8+ adaptive icons.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
